# Kiswahili overrides on top of chirp/lib/default_config.yaml.
#
# Same dataset_id/dataset_config/language_code as whisper/kiswahili/config.yaml
# and gemini/kiswahili/config.yaml (google/fleurs, sw_ke) - see
# chirp/lib/dataset_utils.py for why this reproduces the same clips without
# sharing any code or files with the other two folders.
language_name: swahili
language_code: sw
dataset_id: google/fleurs
dataset_config: sw_ke
text_column: transcription
audio_column: audio

stt:
  # BCP-47 code(s) Cloud STT expects, as opposed to language_code above (which
  # is just this project's folder/display convention, matching Whisper's
  # tokenizer language name style). "sw-KE" is what Google's docs list Chirp 3
  # Swahili support under - confirm this is still current before a real run.
  language_codes: [sw-KE]
