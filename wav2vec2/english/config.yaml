# English overrides on top of wav2vec2/lib/default_config.yaml - the
# baseline/control language, same dataset choice as the other three folders'
# english/config.yaml.
language_name: english
language_code: en
dataset_id: google/fleurs
dataset_config: en_us
text_column: transcription
audio_column: audio

model:
  # facebook/wav2vec2-base-960h - the standard English CTC baseline
  # checkpoint (LibriSpeech 960h), used here purely as a same-architecture
  # control alongside thinkKenya's Swahili checkpoint - not the point of this
  # comparison, but useful to have for parity with whisper/english's role.
  name: facebook/wav2vec2-base-960h
